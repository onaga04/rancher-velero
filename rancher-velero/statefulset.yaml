apiVersion: v1
kind: Namespace
metadata:
  name: valero-test
---
apiVersion: v1
kind: Service
metadata:
  name: azurefile-headless
  namespace: valero-test
spec:
  clusterIP: None
  selector:
    app: azurefile-app
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: azurefile-statefulset
  namespace: valero-test
spec:
  serviceName: azurefile-headless
  replicas: 2
  selector:
    matchLabels:
      app: azurefile-app
  template:
    metadata:
      labels:
        app: azurefile-app
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Pod $(hostname) writing...";
              while true; do
                echo "$(hostname) $(date)" >> /data/output.txt;
                sleep 10;
              done
          volumeMounts:
            - name: shared-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: shared-data
      spec:
        accessModes:
          - ReadWriteMany   # 🔥 important for azurefile
        storageClassName: azurefile-csi
        resources:
          requests:
            storage: 5Gi
