- name: Mark default tokens and tiller configs to be ignored by Velero
  ansible.builtin.shell: |
    # Label default tokens matching the pattern and tiller configmaps
    kubectl get secrets -n {{ included_namespaces }} -o name | grep "default-token-" | xargs -I {} kubectl label {} -n {{ included_namespaces }} velero.io/exclude-from-backup=true --overwrite
    kubectl label configmaps -n {{ included_namespaces }} -l OWNER=TILLER velero.io/exclude-from-backup=true --overwrite
  failed_when: false 
       


