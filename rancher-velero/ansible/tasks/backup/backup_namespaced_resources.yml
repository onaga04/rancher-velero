- name: Backup Namespaced Workloads
  ansible.builtin.command: >
    {{ velero_bin_path | default('velero') }} backup create {{ backup_name_workload }}
    --include-namespaces {{ included_namespaces }}
    --exclude-resources events,replicasets,endpoints,endpointslices,orders.acme.cert-manager.io,challenges.acme.cert-manager.io,certificaterequests.cert-manager.io
    --snapshot-volumes={{ snapshot_volumes | default(true) | lower }}
    --resource-policies-configmap=backup-resource-policies
    {% if snapshot_move_data %} --snapshot-move-data {% endif%}
  poll: "{{ poll_interval }}"
  register: velero_backup_namespaced_result
  changed_when: "'completed' in velero_backup_namespaced_result.stdout or 'created' in velero_backup_namespaced_result.stdout"

#    {% if --default-volumes-to-fs-backup %} --default-volumes-to-fs-backup {% endif%}

#    --selector velero.io/backup=true
#    --resource-policies-configmap=backup-resource-policies
#    --exclude-resources pods,events,replicasets,endpoints,endpointslices,orders.acme.cert-manager.io,challenges.acme.cert-manager.io,certificaterequests.cert-manager.io,persistentvolumeclaims,statefulsets
#    --exclude-resources events,replicasets,endpoints,endpointslices,orders.acme.cert-manager.io,challenges.acme.cert-manager.io,certificaterequests.cert-manager.io

- name: Show Velero backup result
  ansible.builtin.debug:
    msg: "{{ velero_backup_namespaced_result.stdout }}"

- name: Verify Velero backup status
  ansible.builtin.command: velero backup describe {{ backup_name_workload }}
  register: velero_backup_description
  changed_when: false

- name: Display backup description
  ansible.builtin.debug:
    msg: "{{ velero_backup_description.stdout }}"
