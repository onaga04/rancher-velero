- name: Get list of needed CRDs
  ansible.builtin.shell: >
    kubectl get crds -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -vE '\.cattle\.io$|\.rancher\.io$|\.coreos\.com$|\.velero\.io$|\.cert-manager\.io$|\.banzaicloud\.io$|\.gatekeeper\.sh$|\.vmware\.com$|\.projectcalico\.org$' | paste -sd, -
  register: filtered_crds
  changed_when: false

- name: Backup only application CRDs
  ansible.builtin.command: >
    velero backup create {{ backup_name_crds }}
    --include-resources "{{ filtered_crds.stdout }}"
    {% if wait_for_backup %} --wait {% endif %}
  register: velero_backup_crds_result
  changed_when: "'completed' in velero_backup_crds_result.stdout or 'created' in velero_backup_crds_result.stdout"
  when: filtered_crds.stdout | length > 0

- name: Show Velero backup result
  ansible.builtin.debug:
    msg: "{{ velero_backup_crds_result.stdout }}"

- name: Verify Velero backup status
  ansible.builtin.command: velero backup describe {{ backup_name_crds }}
  register: velero_backup_description
  changed_when: false

- name: Display backup description
  ansible.builtin.debug:
    msg: "{{ velero_backup_description.stdout }}"
