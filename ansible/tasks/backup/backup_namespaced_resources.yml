- name: Backup Namespaced Workloads
  ansible.builtin.command: >
    velero backup create {{ backup_name_workload }}
    --include-namespaces {{ included_namespaces }}
    --exclude-resources pods,events
    --default-volumes-to-fs-backup
    --snapshot-volumes={{ snapshot_volumes | default(true) | lower }}
    {% if snapshot_move_data %} --snapshot-move-data {% endif%}
    {% if wait_for_backup %} --wait {% endif %}
  async: {{ async }}
  poll: {{ poll }}
  register: velero_backup_namespaced_result
  changed_when: "'completed' in velero_backup_namespaced_result.stdout or 'created' in velero_backup_namespaced_result.stdout"

- name: Show Velero backup result
  ansible.builtin.debug:
    msg: "{{ velero_backup_namespaced_result.stdout }}"

- name: Verify Velero backup status
  ansible.builtin.command: velero backup describe {{ backup_name }}
  register: velero_backup_description
  changed_when: false

- name: Display backup description
  ansible.builtin.debug:
    msg: "{{ velero_backup_description.stdout }}"
