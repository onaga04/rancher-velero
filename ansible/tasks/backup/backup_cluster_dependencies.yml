- name: Backup Cluster-Scoped RBAC, PriorityClasses and IngressClass
  ansible.builtin.command: >
    velero backup create {{ backup_name_rbac }}
    --include-resources clusterroles.rbac.authorization.k8s.io,clusterrolebindings.rbac.authorization.k8s.io,priorityclasses.scheduling.k8s.io,ingressclasses.networking.k8s.io
    --include-cluster-resources=true
    --exclude-resources *.cattle.io
    --selector '!cattle.io/creator,!field.cattle.io/creatorId'
    {% if wait_for_backup %} --wait {% endif %}
  register: velero_backup_rbac_result
  changed_when: "'completed' in velero_backup_rbac_result.stdout or 'created' in velero_backup_rbac_result.stdout"

- name: Show Velero backup result
  ansible.builtin.debug:
    msg: "{{ velero_backup_rbac_result.stdout }}"

- name: Verify Velero backup status
  ansible.builtin.command: velero backup describe {{ backup_name }}
  register: velero_backup_description
  changed_when: false

- name: Display backup description
  ansible.builtin.debug:
    msg: "{{ velero_backup_description.stdout }}"
