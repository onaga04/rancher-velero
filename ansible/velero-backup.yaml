- name: Velero Backup Playbook
  hosts: source_cluster
  become: yes
  gather_facts: no
  vars_files:
    - group_vars/all.yaml

  tasks:
    - name: Install Azure CLI on Azure hosts
      include_tasks: 
        file: tasks/common/install_azure.yml
        apply:
          tags: Install_Azure_CLI_on_Azure_hosts
      when: cloud_provider == 'azure'
      tags: Install_Azure_CLI_on_Azure_hosts

    - name: Install full Azure CLI setup on non Azure hosts
      include_tasks: 
        file: tasks/common/install_azure_full.yaml
        apply:
          tags: Install_full_Azure_CLI_setup_on_non_Azure_hosts 
      when: cloud_provider != 'azure'
      tags: Install_full_Azure_CLI_setup_on_non_Azure_hosts

    - name: Log in to Azure
      include_tasks: tasks/common/azure_login.yml
      tags: Log_in_to_Azure

    - name: Install Velero CLI
      include_tasks: 
        file: tasks/common/install_velero_cli.yml
        apply:
          tags: Install_Velero_CLI
      tags: Install_Velero_CLI

    - name: Install Velero
      include_tasks:
        file: tasks/common/install_velero.yml
        apply:
          tags: Install_Velero
      tags: Install_Velero

    - name: Setup snapshot class for Velero
      include_tasks:
        file: tasks/backup/setup_snapshotclass.yml
        apply:
          tags: Setup_snapshot_class_for_Velero
      tags: Setup_snapshot_class_for_Velero

    - name: Velero CRDs backup
      include_tasks:
        file: tasks/backup/backup_crds.yml
        apply:
          tags: Velero_CRDs_backup
      tags: Velero_CRDs_backup

    - name: Velero cluster scoped dependencies backup
      include_tasks:
        file: tasks/backup/backup_cluster_dependencies.yml
        apply:
          tags: Velero_cluster_scoped_dependencies_backup
      tags: Velero_cluster_scoped_dependencies_backup

    - name: Velero namespaced resources backup
      include_tasks:
        file: tasks/backup/backup_namespaced_resources.yml
        apply:
          tags: Velero_namespaced_resources_backup
      tags: Velero_namespaced_resources_backup





